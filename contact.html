<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact — LAYN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pc-container">
        <header>
            <div class="logo-group">
                <a href="index.html" class="logo">LAYN</a>
                <span class="tagline">Audio & Film Production</span>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="work.html">What We Do</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>

        <hr class="hairline">

        <main class="contact-section">
            <h1 class="heading-text">Start a Project</h1>
            <p class="body-text" style="color: #8A8A8A; margin-bottom: 40px;">Fill out your requirements below to automatically structure an inquiry mail.</p>
            
            <form id="contactForm" class="interactive-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="label-text">Name</label>
                        <input type="text" id="name" required placeholder="Your name or agency">
                    </div>
                    <div class="form-group">
                        <label class="label-text">Core Needed Pillar</label>
                        <select id="service_type">
                            <option value="Audio Production">Audio Production</option>
                            <option value="Film Production">Film Production</option>
                            <option value="Direction Team / Production Logistics">Production Logistics & Direction Team</option>
                            <option value="Podcast Architecture">Podcast Production</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="label-text">Project Scope & Details</label>
                    <textarea id="message" rows="6" required placeholder="Outline timelines, local material availability criteria, or sound requirements..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Generate Inquiry Mail</button>
            </form>
        </main>

        <footer>
            <span class="label-text">© 2026 LAYN. hello@layn.studio</span>
        </footer>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const service = document.getElementById('service_type').value;
            const msg = document.getElementById('message').value;
            
            const emailSubject = encodeURIComponent(`Project Inquiry - ${service}`);
            const emailBody = encodeURIComponent(`Hi LAYN,\n\nName/Agency: ${name}\nService Required: ${service}\n\nProject Details:\n${msg}`);
            
            window.location.href = `mailto:hello@layn.studio?subject=${emailSubject}&body=${emailBody}`;
        });
    </script>
</body>
</html>
