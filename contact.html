<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CONTACT · LAYN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="line-signature"></div>
    <div class="site-wrapper">
        <header class="nav-container">
            <div class="brand-lockup">
                <span class="logo-text">LAYN</span>
                <span class="logo-sub">AUDIO & FILM PRODUCTION</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">HOME</a>
                <a href="work.html">WHAT WE DO</a>
                <a href="contact.html" class="active">CONTACT</a>
            </nav>
        </header>

        <main class="content-fade-up">
            <section class="contact-section">
                <div class="tagline">COMMUNICATION RADIAL</div>
                <h1>PROJECT INTAKE MAPPING</h1>
                <p class="contact-desc">Select your operational requirements below to format a structured baseline transmission direct to our studio hub.</p>

                <form id="intake-form" class="inquiry-form" onsubmit="generateMail(event)">
                    <div class="form-group">
                        <label for="client-name">IDENTIFICATION / COMPANY NAME</label>
                        <input type="text" id="client-name" required placeholder="Enter name or agency entity">
                    </div>

                    <div class="form-group">
                        <label for="project-vector">PRIMARY OPERATIONAL VECTOR</label>
                        <select id="project-vector" required>
                            <option value="">SELECT VECTOR...</option>
                            <option value="Audio Production Integration">AUDIO PRODUCTION INTEGRATION</option>
                            <option value="Film Production Framework">FILM PRODUCTION FRAMEWORK</option>
                            <option value="Podcast Architecture & Layout">PODCAST ARCHITECTURE &amp; LAYOUT</option>
                            <option value="Moroccan Local Operations Support">MOROCCAN LOCAL OPERATIONS SUPPORT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="project-scope">PROJECT OVERVIEW &amp; PARADIGMS</label>
                        <textarea id="project-scope" rows="5" required placeholder="Detail the structural elements, timeline boundaries, and operational constraints..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">GENERATE INQUIRY MAIL</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        function generateMail(e) {
            e.preventDefault();
            const name = document.getElementById('client-name').value;
            const vector = document.getElementById('project-vector').value;
            const scope = document.getElementById('project-scope').value;

            const subject = encodeURIComponent(`[LAYN INTAKE] ${name} - ${vector}`);
            const body = encodeURIComponent(
                `LAYN INTAKE STRUCTURE\n` +
                `--------------------------------------\n` +
                `ENTITY NAME: ${name}\n` +
                `SELECTED VECTOR: ${vector}\n` +
                `\n` +
                `PROJECT PARADIGMS & SCOPE:\n` +
                `${scope}\n` +
                `--------------------------------------\n` +
                `Generated natively via LAYN system tool.`
            );

            window.location.href = `mailto:hello@layn.studio?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
